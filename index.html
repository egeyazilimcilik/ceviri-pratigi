<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çeviri Pratiği</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --ink: #1f1c18; --muted: #6f675d; --line: #e4ddd2; --track: #efe9df;
    --accent: #c2410c; --accent-ink: #ffffff;
    --ok: #15803d; --ok-bg: #dcfce7; --bad: #b91c1c; --bad-bg: #fee2e2;
    --typo: #a16207; --typo-bg: #fef3c7; --move: #7e22ce; --move-bg: #f3e8ff;
    --miss-bg: #e0f2fe; --miss: #0369a1;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(60,40,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f; --card: #211d17; --ink: #f1ebe2; --muted: #a39a8d; --line: #3a332a; --track: #2d2820;
      --accent: #fb923c; --accent-ink: #1a1007;
      --ok: #4ade80; --ok-bg: #14321f; --bad: #f87171; --bad-bg: #3b1616;
      --typo: #fbbf24; --typo-bg: #3a2c0b; --move: #c084fc; --move-bg: #2e1a40;
      --miss: #7dd3fc; --miss-bg: #0f2a3a; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f; --card: #211d17; --ink: #f1ebe2; --muted: #a39a8d; --line: #3a332a; --track: #2d2820;
    --accent: #fb923c; --accent-ink: #1a1007;
    --ok: #4ade80; --ok-bg: #14321f; --bad: #f87171; --bad-bg: #3b1616;
    --typo: #fbbf24; --typo-bg: #3a2c0b; --move: #c084fc; --move-bg: #2e1a40;
    --miss: #7dd3fc; --miss-bg: #0f2a3a; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; font-size: 16px; line-height: 1.5; min-height: 100vh; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 28px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 20px; margin: 0 0 12px; }
  .stats { display: flex; gap: 18px; color: var(--muted); font-size: 14px; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
  .tab { background: none; border: none; font: inherit; font-weight: 600; font-size: 15px; color: var(--muted); padding: 10px 14px; cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab .count { background: var(--bad-bg); color: var(--bad); border-radius: 999px; padding: 0 7px; font-size: 12px; margin-left: 4px; }
  .tab .count:empty { display: none; }

  .levels { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .lvl { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .lvl small { font-weight: 400; color: var(--muted); margin-left: 4px; }
  .lvl:hover { border-color: var(--accent); }
  .lvl[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .lvl[aria-pressed="true"] small { color: inherit; opacity: .8; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 16px; }
  .meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .roundbar { height: 4px; background: var(--track); border-radius: 4px; margin-bottom: 18px; overflow: hidden; }
  .roundbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
  .tr { font-family: "Fraunces", Georgia, serif; font-size: clamp(22px, 4.5vw, 30px); font-weight: 500; line-height: 1.3; margin: 0 0 6px; }
  .topic { display: inline-block; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; margin-bottom: 18px; }
  .hint { color: var(--muted); font-size: 14px; margin: -6px 0 16px; letter-spacing: .04em; }
  .hint:empty { display: none; }

  .input-row { display: flex; gap: 10px; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 13px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  input[type=text]:disabled { opacity: .7; }
  .btn { font: inherit; font-weight: 600; font-size: 15px; border-radius: 12px; padding: 12px 20px; cursor: pointer; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .btn.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
  .btn.small { padding: 6px 12px; font-size: 13.5px; border-radius: 10px; }
  .tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .tools .btn { padding: 7px 14px; font-size: 14px; }

  .result { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 22px; display: none; }
  .result.show { display: block; }
  .verdict { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; margin-bottom: 14px; }
  .verdict .score { margin-left: auto; font-size: 14px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .verdict.ok { color: var(--ok); } .verdict.almost { color: var(--typo); } .verdict.bad { color: var(--bad); }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin: 14px 0 6px; }
  .diff { display: flex; flex-wrap: wrap; gap: 6px; font-size: 17px; line-height: 1.4; }
  .tok { padding: 3px 8px; border-radius: 7px; display: inline-flex; gap: 6px; align-items: baseline; }
  .tok.eq { background: var(--ok-bg); color: var(--ok); }
  .tok.sub { background: var(--bad-bg); color: var(--bad); }
  .tok.typo { background: var(--typo-bg); color: var(--typo); }
  .tok.extra { background: var(--bad-bg); color: var(--bad); text-decoration: line-through; opacity: .85; }
  .tok.missing { background: var(--miss-bg); color: var(--miss); border: 1.5px dashed currentColor; padding: 1.5px 6.5px; }
  .tok.moved { background: var(--move-bg); color: var(--move); }
  .tok s { opacity: .7; }
  .tok .fix { font-weight: 700; }
  .tok .fix::before { content: "→ "; font-weight: 400; opacity: .7; }
  .answer { font-size: 17px; font-weight: 500; }
  .notes { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
  .notes li { margin: 3px 0; }
  details { margin-top: 12px; font-size: 14px; color: var(--muted); }
  details summary { cursor: pointer; }
  details ul { margin: 6px 0 0; padding-left: 18px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 18px; font-size: 12.5px; color: var(--muted); }
  .legend .tok { font-size: 12px; padding: 1px 7px; }

  /* Tur özeti */
  .summary { text-align: center; }
  .big { font-family: "Fraunces", Georgia, serif; font-size: 64px; font-weight: 600; line-height: 1; margin: 6px 0; font-variant-numeric: tabular-nums; }
  .big span { color: var(--muted); font-size: 32px; }
  .summary .sub { color: var(--muted); margin: 0 0 18px; }
  .summary .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  .summary h3, .panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 22px 0 8px; text-align: left; }

  /* Listeler / satırlar */
  .mlist { list-style: none; padding: 0; margin: 0; text-align: left; }
  .mlist li { border-top: 1px solid var(--line); padding: 12px 0; }
  .mlist li:first-child { border-top: none; }
  .mlist .q { font-weight: 600; }
  .mlist .yours { color: var(--bad); font-size: 14.5px; }
  .mlist .yours s { opacity: .9; }
  .mlist .right { color: var(--ok); font-size: 14.5px; }
  .mlist .chips { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .tile .v { font-family: "Fraunces", Georgia, serif; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tile .k { font-size: 13px; color: var(--muted); }
  @media (max-width: 600px) { .tiles { grid-template-columns: repeat(2, 1fr); } }

  .rows { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: minmax(90px, 190px) 1fr auto; align-items: center; gap: 12px; font-size: 14.5px; }
  .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .val { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .row .val b { color: var(--ink); }
  .bar { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; min-width: 2px; }
  .row.topicrow { grid-template-columns: minmax(90px, 190px) 1fr auto auto; }
  .empty { color: var(--muted); font-size: 14.5px; margin: 4px 0; }
  .tips { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 8px; }
  .tips li { background: var(--bg); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14.5px; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; }
  .words .tok { font-size: 14px; }
  .words .n { opacity: .7; font-size: 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
  @media (max-width: 600px) { .two { grid-template-columns: 1fr; } .row, .row.topicrow { grid-template-columns: 110px 1fr auto; } .row.topicrow .btn { grid-column: 1 / -1; justify-self: start; } }

  .pattern { background: var(--bg); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14.5px; text-align: left; }
  .pattern + .pattern { margin-top: 8px; }
  #patternPre { margin-top: 14px; }
  .pattern .p-name { font-weight: 700; }
  .pattern code { display: block; font-family: inherit; font-weight: 600; color: var(--accent); margin: 2px 0 4px; }
  .pattern p { margin: 0; color: var(--muted); }
  .pattern .p-ex { font-style: italic; margin-top: 2px; }
  .lvlprog { background: var(--bg); border-radius: 12px; padding: 14px 16px; text-align: left; margin-top: 4px; }
  .lvlprog .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; margin-bottom: 8px; flex-wrap: wrap; }
  .lvlprog .hist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  footer { margin-top: 22px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  footer button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; text-decoration: underline; padding: 0; }
  kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
  [hidden] { display: none !important; }

  @media (max-width: 540px) {
    .card { padding: 20px; }
    .input-row { flex-direction: column; }
    #main { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Çeviri <span>Pratiği</span></h1>
    <div class="stats">
      <div>Doğruluk <b id="sAcc">–</b></div>
      <div>Seri <b id="sStreak">0</b></div>
      <div>En iyi <b id="sBest">0</b></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="practice" aria-selected="true">Pratik</button>
    <button class="tab" role="tab" data-view="stats" aria-selected="false">İstatistikler</button>
    <button class="tab" role="tab" data-view="mistakes" aria-selected="false">Yanlışlarım <span class="count" id="mCount"></span></button>
  </nav>

  <!-- PRATİK -->
  <section id="v-practice">
    <div class="levels" id="levels" role="group" aria-label="Seviye"></div>
    <main class="card">
      <div id="qa">
        <div class="meta"><span id="lvlTag"></span><span id="progress"></span></div>
        <div class="roundbar"><i id="roundFill" style="width:0"></i></div>
        <p class="tr" id="tr"></p>
        <span class="topic" id="topic"></span>
        <p class="hint" id="hint"></p>
        <div class="input-row">
          <input type="text" id="answer" placeholder="İngilizce çevirini yaz…" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="btn" id="main">Kontrol et</button>
        </div>
        <div class="tools">
          <button class="btn ghost" id="patternBtn">Kalıbı gör</button>
          <button class="btn ghost" id="hintBtn">İpucu</button>
          <button class="btn ghost" id="revealBtn">Cevabı göster</button>
          <button class="btn ghost" id="skipBtn">Atla</button>
        </div>
        <div id="patternPre" hidden></div>
        <section class="result" id="result" aria-live="polite">
          <div class="verdict" id="verdict"></div>
          <div class="label">Senin cevabın</div>
          <div class="diff" id="diff"></div>
          <div class="label">Doğru cevap</div>
          <div class="answer" id="correct"></div>
          <ul class="notes" id="notes"></ul>
          <div class="label">Bu cümlenin kalıbı</div>
          <div id="patternPost"></div>
          <details id="alts"><summary></summary><ul id="altList"></ul></details>
          <div class="legend">
            <span class="tok eq">doğru</span><span class="tok sub">yanlış kelime</span><span class="tok typo">yazım hatası</span>
            <span class="tok extra">fazla</span><span class="tok missing">eksik</span><span class="tok moved">yanlış yerde</span>
          </div>
        </section>
      </div>
      <div id="summary" class="summary" hidden></div>
    </main>
  </section>

  <!-- İSTATİSTİKLER -->
  <section id="v-stats" hidden></section>

  <!-- YANLIŞLARIM -->
  <section id="v-mistakes" hidden></section>

  <footer>
    <span><kbd>Enter</kbd> kontrol et / sonraki · Noktalama ve büyük harf önemsizdir.</span>
    <button id="resetBtn">Tüm verileri sıfırla</button>
  </footer>
</div>

<script>
/* ================= Konular ================= */
const T = {
  be: "be fiili (am/is/are)", gz: "Geniş zaman", sz: "Şimdiki zaman", there: "There is / are", iy: "İyelik (my / your)",
  emir: "Emir cümleleri", soru: "Soru cümleleri", can: "can / could", gec: "Geçmiş zaman", gel: "Gelecek zaman",
  kars: "Karşılaştırma", pp: "Present perfect", used: "used to", pc: "Past continuous", bag: "Bağlaçlar",
  k1: "1. tip koşul", k2: "2. tip koşul", k3: "3. tip koşul", ed: "Edilgen yapı", ppc: "Present perfect continuous",
  dol: "Dolaylı anlatım", wish: "wish / keşke", fk: "Fiil kalıpları (-ing / to)", zb: "Zaman bağlaçları",
  zor: "Zorunluluk (must / have to)", pperf: "Past perfect", so: "so / such", mp: "Modal perfect", kal: "Kalıplar", dev: "Devrik yapı",
};

/* ================= Cümle bankası =================
   [Türkçe, [kabul edilen çeviriler], konu]
   {a|b} = alternatifler, {a|} = isteğe bağlı kelime. */
const BANK = {
  A1: [
    ["Ben bir öğrenciyim.", ["I am a student."], "be"],
    ["Kedim çok küçük.", ["My cat is very {small|little}."], "be"],
    ["Her sabah kahve içerim.", ["I drink coffee every morning.", "Every morning I drink coffee."], "gz"],
    ["Onun adı Ayşe.", ["{Her|His} name is Ayşe."], "iy"],
    ["Bugün hava çok sıcak.", ["The weather is very hot today.", "It is very hot today.", "Today {the weather|it} is very hot."], "be"],
    ["Kardeşim on yaşında.", ["My {brother|sister|sibling} is ten{ years old|}."], "be"],
    ["Elma severim.", ["I {like|love} apples."], "gz"],
    ["Okul evimin yanında.", ["The school is {next to|near|beside} my {house|home}."], "be"],
    ["Bu kitap kırmızı.", ["This book is red."], "be"],
    ["Annem bir öğretmen.", ["My {mother|mom|mum} is a teacher."], "iy"],
    ["Masada iki kalem var.", ["There are two {pens|pencils} on the table."], "there"],
    ["Ben Türkiye'denim.", ["I am from {Turkey|Türkiye}."], "be"],
    ["Saat kaç?", ["What time is it?", "What is the time?"], "soru"],
    ["Köpeğim parkta koşuyor.", ["My dog is running in the park."], "sz"],
    ["Akşamları televizyon izleriz.", ["We watch {TV|television} in the {evenings|evening}."], "gz"],
    ["Su içmek istiyorum.", ["I {want|would like} to drink {some |}water."], "gz"],
    ["Babam araba kullanıyor.", ["My {father|dad} is driving{ a car| the car|}.", "My {father|dad} drives a car."], "sz"],
    ["Onlar benim arkadaşlarım.", ["They are my friends."], "iy"],
    ["Pencereyi aç, lütfen.", ["{Please open|Open} the window{, please|}."], "emir"],
    ["Ekmek ve peynir yiyorum.", ["I am eating bread and cheese.", "I eat bread and cheese."], "sz"],
    ["Ben her gün okula yürürüm.", ["I walk to school every day.", "Every day I walk to school."], "gz"],
    ["O bir doktor.", ["{He|She} is a doctor."], "be"],
    ["Şu an kahvaltı yapıyoruz.", ["We are {having|eating} breakfast {now|right now|at the moment}.", "We are {now |}{having|eating} breakfast."], "sz"],
    ["Bu benim çantam.", ["This is my bag."], "iy"],
    ["Senin kalemin nerede?", ["Where is your {pen|pencil}?"], "soru"],
    ["İngilizce konuşabilirim.", ["I can speak English."], "can"],
    ["Kız kardeşim gitar çalamaz.", ["My sister cannot play {the |}guitar."], "can"],
    ["Buzdolabında süt var mı?", ["Is there {any |}milk in the {fridge|refrigerator}?"], "there"],
    ["Hafta sonları futbol oynarız.", ["We play {football|soccer} {at|on} {the |}weekends."], "gz"],
    ["Kapıyı kapat.", ["{Close|Shut} the door."], "emir"],
    ["Onlar şimdi parkta oynuyorlar.", ["They are playing in the park {now|right now}.", "They are {now |}playing in the park."], "sz"],
    ["Benim adım Can.", ["My name is Can."], "iy"],
    ["Kaç yaşındasın?", ["How old are you?"], "soru"],
    ["Bu ev çok büyük.", ["This house is very {big|large}."], "be"],
    ["Odada üç sandalye var.", ["There are three chairs in the room."], "there"],
    ["Babam her gün çalışır.", ["My {father|dad} works every day."], "gz"],
    ["Bana yardım edebilir misin?", ["{Can|Could} you help me?"], "can"],
    ["Lütfen sessiz olun.", ["{Please be quiet|Be quiet, please}."], "emir"],
    ["Kahveyi sütlü severim.", ["I like {my |}coffee with milk."], "gz"],
    ["Bugün pazartesi.", ["{Today is Monday|It is Monday{ today|}}."], "be"],
  ],
  A2: [
    ["Dün akşam sinemaya gittik.", ["We went to the {cinema|movies} {last night|yesterday evening}.", "{Last night|Yesterday evening} we went to the {cinema|movies}."], "gec"],
    ["Yarın erken kalkacağım.", ["I {will|am going to} {get up|wake up} early tomorrow.", "Tomorrow I {will|am going to} {get up|wake up} early."], "gel"],
    ["Geçen yaz İzmir'i ziyaret ettim.", ["I visited İzmir last summer.", "Last summer I visited İzmir."], "gec"],
    ["Kardeşimden daha uzunum.", ["I am taller than my {brother|sister|sibling}."], "kars"],
    ["Telefonumu evde unuttum.", ["I {forgot|left} my phone at home."], "gec"],
    ["Ne zaman geleceksin?", ["When will you come?", "When are you coming?", "When are you going to come?"], "gel"],
    ["Çocukken çok kitap okurdum.", ["I {used to read|read} {a lot of|many|lots of} books when I was a {child|kid}.", "When I was a {child|kid}, I {used to read|read} {a lot of|many|lots of} books."], "used"],
    ["Bu restoran şehirdeki en iyi restoran.", ["This {restaurant is|is} the best restaurant in {the city|town}.", "This restaurant is the best in {the city|town}."], "kars"],

/* ================= {a|b} genişletme ================= */
function expand(s) {
  const i = s.indexOf("{");
  if (i < 0) return [s];
  let depth = 0, j = i, parts = [], start = i + 1;
  for (; j < s.length; j++) {
    const c = s[j];
    if (c === "{") depth++;
    else if (c === "}") { depth--; if (depth === 0) { parts.push(s.slice(start, j)); break; } }
    else if (c === "|" && depth === 1) { parts.push(s.slice(start, j)); start = j + 1; }
  }
  const pre = s.slice(0, i), post = s.slice(j + 1), out = [];
  for (const p of parts) for (const e of expand(pre + p + post)) out.push(e.replace(/\s+/g, " ").replace(/\s+([,.?!])/g, "$1").replace(/,+/g, ",").trim());
  return [...new Set(out)];
}
function prep(s) { if (!s.answers) { s.answers = [...new Set(s.raw.flatMap(expand).map(a => a[0].toUpperCase() + a.slice(1)))]; s.norm = s.answers.map(normalize); } return s; }

/* ================= Normalleştirme ================= */
const SPELL = { neighbour: "neighbor", apologised: "apologized", realised: "realized", colour: "color", cancelled: "canceled", travelling: "traveling", favourite: "favorite", realise: "realize",
  organise: "organize", centre: "center", theatre: "theater", criticise: "criticize", apologise: "apologize", grey: "gray" };
const NUM = { "0": "zero", "1": "one", "2": "two", "3": "three", "4": "four", "5": "five", "6": "six", "7": "seven", "8": "eight", "9": "nine", "10": "ten", "100": "hundred" };
function normalize(text) {
  let t = text.toLowerCase().replace(/[’‘`´]/g, "'").replace(/ı/g, "i").normalize("NFD").replace(/[̀-ͯ]/g, "");
  t = t.replace(/\bwon't\b/g, "will not").replace(/\bcan't\b/g, "cannot").replace(/\bshan't\b/g, "shall not")
       .replace(/n't\b/g, " not").replace(/'m\b/g, " am").replace(/'re\b/g, " are").replace(/'ve\b/g, " have")
       .replace(/'ll\b/g, " will").replace(/'d\b/g, " would").replace(/\blet's\b/g, "let us")
       .replace(/\b(he|she|it|that|there|what|who|where|here|how)'s\b/g, "$1 is")
       .replace(/\bcan not\b/g, "cannot");
  t = t.replace(/['"]/g, "").replace(/[-–—\/]/g, " ").replace(/[^a-z0-9\s]/g, " ");
  return t.split(/\s+/).filter(Boolean).map(w => SPELL[w] || NUM[w] || w);
}

/* ================= Karşılaştırma ================= */
function lev(a, b) {
  const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function isTypo(a, b) {
  if (Math.max(a.length, b.length) < 4) return false;
  return lev(a, b) <= (Math.max(a.length, b.length) <= 6 ? 1 : 2);
}
function align(user, ref) {
  const m = user.length, n = ref.length;
  const D = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) D[i][0] = i;
  for (let j = 0; j <= n; j++) D[0][j] = j;
  const subCost = (a, b) => a === b ? 0 : isTypo(a, b) ? 0.5 : 1;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + subCost(user[i - 1], ref[j - 1]));
  const ops = []; let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && D[i][j] === D[i - 1][j - 1] + subCost(user[i - 1], ref[j - 1])) {
      const a = user[i - 1], b = ref[j - 1];
      ops.push({ type: a === b ? "eq" : isTypo(a, b) ? "typo" : "sub", u: a, r: b }); i--; j--;
    } else if (i > 0 && D[i][j] === D[i - 1][j] + 1) { ops.push({ type: "extra", u: user[i - 1] }); i--; }
    else { ops.push({ type: "missing", r: ref[j - 1] }); j--; }
  }
  ops.reverse();
  for (let k = 0; k + 1 < ops.length; k++) {
    const a = ops[k], b = ops[k + 1];
    if (a.type === "sub" && b.type === "sub" && a.u === b.r && b.u === a.r) { a.type = b.type = "moved"; k++; }
  }
  for (const op of ops) {
    if (op.type !== "extra") continue;
    const twin = ops.find(o => o.type === "missing" && o.r === op.u && !o.paired);
    if (twin) { op.type = "moved"; twin.type = "movedTarget"; twin.paired = true; }
  }
  return { cost: D[m][n], ops };
}

const store = {

  set(k, v) { try { localStorage.setItem("cp2_" + k, JSON.stringify(v)); } catch {} },
};

function saveAll() { store.set("attempts", attempts.slice(-3000)); store.set("rounds", rounds.slice(-300)); store.set("meta", meta); store.set("round", round); }

function infoMap() {
  const m = {};
  for (const a of attempts) {
    const x = m[a.id] || (m[a.id] = { n: 0, wrong: 0 });
    x.n++; if (!isOk(a.s)) x.wrong++; x.last = a.ts; x.lastOk = isOk(a.s); x.lastA = a;
  }
  return m;
}
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildRound(mode, key) {
  const info = infoMap(); let cands, label;
  if (mode === "level") { cands = key === "MIX" ? ALL : ALL.filter(s => s.l === key); label = key === "MIX" ? "Karışık" : key; }
  else if (mode === "topic") { cands = ALL.filter(s => s.t === key); label = T[key]; }
  else if (mode === "mistakes") { cands = ALL.filter(s => info[s.id] && !info[s.id].lastOk); label = "Yanlışlarım"; }
  else { cands = key.map(id => BY[id]).filter(Boolean); label = "Tekrar"; }
  // Önce hiç görülmemiş, sonra yanlış yapılmış, sonra en uzun süredir görülmemiş cümleler
  const unseen = shuffle(cands.filter(s => !info[s.id]));
  const wrong = shuffle(cands.filter(s => info[s.id] && !info[s.id].lastOk));
  const rest = cands.filter(s => info[s.id] && info[s.id].lastOk).sort((a, b) => info[a.id].last - info[b.id].last);
  // Aynı kalıptan en fazla 2 soru gelsin ki test çeşitli olsun
  const ordered = [...unseen, ...wrong, ...rest], picked = [], perGroup = {};
  for (const s of ordered) { if (picked.length >= ROUND) break; if ((perGroup[s.g] || 0) >= 2) continue; perGroup[s.g] = (perGroup[s.g] || 0) + 1; picked.push(s); }
  for (const s of ordered) { if (picked.length >= ROUND) break; if (!picked.includes(s)) picked.push(s); }
  const no = rounds.filter(r => r.label === label).length + 1;
  return { mode, key: mode === "ids" ? null : key, label, no, ids: shuffle(picked.map(s => s.id)), results: [], done: false };
}

function record(status, pct, userText, ref, ops) {
  const e = (ops || []).filter(o => o.type !== "eq" && o.type !== "movedTarget").map(o => ({ y: o.type, u: o.u, r: o.r }));
  attempts.push({ id: current.id, l: current.l, t: current.t, s: status, p: pct, ts: Date.now(), u: userText, r: ref, e });
  if (isOk(status)) { meta.streak++; meta.best = Math.max(meta.best, meta.streak); } else meta.streak = 0;
  round.results.push({ id: current.id, s: status, u: userText, r: ref });
  if (round.results.length >= round.ids.length && !round.done) {
    round.done = true;
    rounds.push({ ts: Date.now(), label: round.label, mode: round.mode, c: round.results.filter(r => isOk(r.s)).length, n: round.results.length });
  }
  saveAll(); renderHeader();
  $("roundFill").style.width = `${100 * round.results.length / round.ids.length}%`;
}

function evaluate(userText) {
  const user = normalize(userText);
  let best = null;
  current.norm.forEach((ref, k) => { const res = align(user, ref); if (!best || res.cost < best.cost) best = { ...res, k }; });
  const wrong = best.ops.filter(o => o.type !== "eq");
  const pct = Math.max(0, Math.round(100 * (1 - best.cost / Math.max(current.norm[best.k].length, user.length, 1))));
  return { user, best, wrong, perfect: wrong.length === 0, onlyTypos: wrong.length > 0 && wrong.every(o => o.type === "typo"), pct };
}

function check(mode = "answer") {
  if (checked) return;
  const userText = $("answer").value.trim();
  if (!userText && mode === "answer") { $("answer").focus(); return; }
  const ev = evaluate(userText);
  const { best, perfect, onlyTypos, pct, user } = ev;

  let status;
  if (mode === "reveal") status = "revealed";
  else if (perfect || onlyTypos) status = usedHelp ? "hint" : (perfect ? "ok" : "typo");
  else status = "wrong";
  record(status, mode === "reveal" ? 0 : pct, userText, current.answers[best.k], user.length ? best.ops : []);

  const v = $("verdict");
  if (status === "revealed") { v.className = "verdict bad"; v.innerHTML = "Cevap gösterildi"; }
  else if (status === "hint") { v.className = "verdict almost"; v.innerHTML = `✓ Doğru, ama ipucuyla <span class="score">yanlışlara eklendi</span>`; }
  else if (status === "ok") { v.className = "verdict ok"; v.innerHTML = `✓ Mükemmel! <span class="score">%100</span>`; }
  else if (status === "typo") { v.className = "verdict almost"; v.innerHTML = `≈ Neredeyse doğru — sadece yazım hatası <span class="score">%${pct}</span>`; }
  else { v.className = "verdict bad"; v.innerHTML = `✗ Hatalar var <span class="score">%${pct} doğru</span>`; }

  const diff = $("diff");
  if (!user.length) diff.innerHTML = `<span style="color:var(--muted)">—</span>`;
  else diff.innerHTML = best.ops.map(tokHtml).join("");
  $("correct").textContent = current.answers[best.k];

  const notes = [], c = t => best.ops.filter(o => o.type === t);
  if (user.length) {
    if (c("sub").length) notes.push(`${c("sub").length} yanlış kelime: ` + c("sub").map(o => `<b>${esc(o.u)}</b> yerine <b>${esc(o.r)}</b>`).join(", "));
    if (c("typo").length) notes.push(`Yazım hatası: ` + c("typo").map(o => `<b>${esc(o.u)}</b> → <b>${esc(o.r)}</b>`).join(", "));
    if (c("missing").length) notes.push(`Eksik: ` + c("missing").map(o => `<b>${esc(o.r)}</b>`).join(", "));
    if (c("extra").length) notes.push(`Fazla: ` + c("extra").map(o => `<b>${esc(o.u)}</b>`).join(", "));
    if (c("moved").length) notes.push(`Kelime sırası hatalı: ` + c("moved").map(o => `<b>${esc(o.u)}</b>`).join(", "));
  }
  $("notes").innerHTML = notes.map(n => `<li>${n}</li>`).join("");

  const others = current.answers.filter((_, k) => k !== best.k);
  $("alts").hidden = !others.length;
  $("alts").querySelector("summary").textContent = `Kabul edilen diğer çeviriler (${others.length})`;
  $("altList").innerHTML = others.slice(0, 12).map(a => `<li>${esc(a)}</li>`).join("") + (others.length > 12 ? `<li>… ve ${others.length - 12} tane daha</li>` : "");

  $("result").classList.add("show");
  afterAnswer();
}
function tokHtml(o) {
  switch (o.type) {
    case "eq": return `<span class="tok eq">${esc(o.u)}</span>`;
    case "sub": return `<span class="tok sub" title="Yanlış kelime"><s>${esc(o.u)}</s><span class="fix">${esc(o.r)}</span></span>`;
    case "typo": return `<span class="tok typo" title="Yazım hatası"><s>${esc(o.u)}</s><span class="fix">${esc(o.r)}</span></span>`;
    case "extra": return `<span class="tok extra" title="Fazla kelime">${esc(o.u)}</span>`;
    case "missing": return `<span class="tok missing" title="Eksik kelime">${esc(o.r)}</span>`;
    case "moved": return `<span class="tok moved" title="Bu kelime başka bir yerde olmalı">${esc(o.u)} ↷</span>`;
    case "movedTarget": return `<span class="tok missing" style="color:var(--move);background:var(--move-bg)" title="Taşınması gereken kelime buraya">${esc(o.r)} ↶</span>`;
  }
  return "";
}
function afterAnswer() {
  checked = true;
  $("answer").disabled = true;
  const last = round.results.length >= round.ids.length;
  $("main").textContent = last ? "Testi bitir →" : "Sonraki →";
  ["hintBtn", "revealBtn", "skipBtn", "patternBtn"].forEach(id => $(id).disabled = true);
  $("patternPre").hidden = true;
  $("main").focus();
}
function skip() {
  if (checked) return;
  record("skipped", 0, "", current.answers[0], []);
  showQuestion();
}

function hint() {
  usedHelp = true;
  const words = current.answers[0].split(" ");
  hintStep = Math.min(hintStep + 1, 3);
  const L = /\p{L}/u;
  const blank = w => [...w].map(ch => L.test(ch) ? "_" : ch).join("");
  const firstOnly = w => { let seen = false; return [...w].map(ch => !L.test(ch) ? ch : seen ? "_" : (seen = true, ch)).join(""); };
  let h;
  if (hintStep === 1) h = words.map(blank).join(" ");
  else if (hintStep === 2) h = words.map(firstOnly).join(" ");
  else h = words.map((w, i) => i < Math.ceil(words.length / 2) ? w : firstOnly(w)).join(" ");
  $("hint").textContent = h;
  $("answer").focus();
}

/* ---------- Seviye ilerlemesi ---------- */
const PASS = 0.7, LEVEL_GOAL = 5;
function levelTests(key) { return rounds.filter(r => r.mode === "level" && r.label === (key === "MIX" ? "Karışık" : key)); }
function progressHtml() {
  if (round.mode !== "level") return "";
  const ts = levelTests(round.key), passed = ts.filter(r => r.c / r.n >= PASS).length;
  const cur = ts[ts.length - 1], prev = ts[ts.length - 2];
  const delta = prev ? cur.c - prev.c : null;
  const cmp = delta === null ? "İlk testin" : delta > 0 ? `Önceki teste göre +${delta} doğru` : delta < 0 ? `Önceki teste göre ${delta} doğru` : "Önceki testle aynı";
  const name = round.key === "MIX" ? "Karışık" : round.key;
  return `<div class="lvlprog">
    <div class="top"><b>${esc(name)} ilerlemen: ${Math.min(passed, LEVEL_GOAL)} / ${LEVEL_GOAL} test geçildi</b><span style="color:var(--muted)">${esc(cmp)}</span></div>
    <div class="bar" title="Geçmek için en az %${PASS * 100} doğru gerekir"><i style="width:${100 * Math.min(passed, LEVEL_GOAL) / LEVEL_GOAL}%"></i></div>
    <div class="hist">${ts.slice(-8).map((r, i, a) => `<span class="chip">Test ${ts.length - a.length + i + 1}: ${r.c}/${r.n}${r.c / r.n >= PASS ? " ✓" : ""}</span>`).join("")}</div>
  </div>`;
}

/* ---------- Tur özeti ---------- */
function showSummary() {
  checked = false;
  $("qa").hidden = true; const box = $("summary"); box.hidden = false;
  const res = round.results, n = res.length, c = res.filter(r => isOk(r.s)).length;
  const typos = res.filter(r => r.s === "typo").length;
  const wrongs = res.filter(r => !isOk(r.s));
  const byTopic = {};
  res.forEach(r => { const t = BY[r.id].t; const x = byTopic[t] || (byTopic[t] = { n: 0, w: 0 }); x.n++; if (!isOk(r.s)) x.w++; });
  const weak = Object.entries(byTopic).filter(([, x]) => x.w).sort((a, b) => b[1].w / b[1].n - a[1].w / a[1].n || b[1].w - a[1].w).slice(0, 4);
  const msg = c === n ? "Kusursuz test! 🎉" : c / n >= .8 ? "Harika gidiyorsun." : c / n >= .5 ? "Fena değil, yanlışlarını tekrar et." : "Bu seviye biraz zorlayıcı — yanlışlarını tekrar etmeyi dene.";
  const nextLevel = round.mode === "level" ? round.key : level;
  const li = LEVELS.indexOf(round.key);
  const upLevel = round.mode === "level" && li >= 0 && li < LEVELS.length - 1 && levelTests(round.key).filter(r => r.c / r.n >= PASS).length >= LEVEL_GOAL ? LEVELS[li + 1] : null;
  box.innerHTML = `
    <div class="meta" style="justify-content:center">${esc(round.label)} · Test ${round.no} tamamlandı</div>
    <div class="big">${c}<span>/${n}</span></div>
    <p class="sub">%${Math.round(100 * c / n)} doğruluk${typos ? ` · ${typos} yazım hatası` : ""} · ${esc(msg)}</p>
    ${progressHtml()}
    ${weak.length ? `<h3>Bu testte zorlandığın konular</h3><div class="rows">${weak.map(([t, x]) => `
      <div class="row topicrow"><span class="name" title="${esc(T[t])}">${esc(T[t])}</span>
      <div class="bar" title="${x.n - x.w}/${x.n} doğru"><i style="width:${100 * (x.n - x.w) / x.n}%"></i></div>
      <span class="val"><b>${x.n - x.w}</b>/${x.n}</span>
      <button class="btn ghost small" data-topic="${t}">Çalış</button></div>`).join("")}</div>
      <h3>Kullanman gereken kalıplar</h3>${weak.map(([t]) => noteHtml(t)).join("")}` : ""}
    ${wrongs.length ? `<h3>Yanlış yaptıkların (${wrongs.length})</h3><ul class="mlist">${wrongs.map(r => `
      <li><div class="q">${esc(BY[r.id].tr)}</div>
      ${r.u ? `<div class="yours">Senin: <s>${esc(r.u)}</s></div>` : `<div class="yours">${esc(STATUS_TR[r.s])}</div>`}
      <div class="right">Doğru: ${esc(r.r)}</div></li>`).join("")}</ul>` : ""}
    <div class="actions">
      <button class="btn" id="newRound">Sonraki test (${esc(nextLevel === "MIX" ? "Karışık" : nextLevel)})</button>
      ${upLevel ? `<button class="btn ghost" id="upLevel">${upLevel} seviyesine geç</button>` : ""}
      ${wrongs.length ? `<button class="btn ghost" id="retryWrong">Bu testin yanlışlarını tekrar et</button>` : ""}
      <button class="btn ghost" id="toStats">İstatistiklere bak</button>
    </div>`;
  $("newRound").onclick = () => startRound("level", nextLevel);
  if (wrongs.length) $("retryWrong").onclick = () => startRound("ids", [...new Set(wrongs.map(r => r.id))]);
  $("toStats").onclick = () => setView("stats");
  if (upLevel) $("upLevel").onclick = () => { level = upLevel; store.set("level", upLevel); startRound("level", upLevel); };
  box.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => startRound("topic", b.dataset.topic));
  window.scrollTo(0, 0);
}

/* ---------- İstatistikler ---------- */
function analyze() {
  const typed = attempts.filter(a => a.s !== "revealed" && a.s !== "skipped");
  const types = { sub: 0, typo: 0, missing: 0, extra: 0, moved: 0 };
  const pairs = {}, missing = {}, extra = {};
  for (const a of typed) for (const e of a.e || []) {
    if (types[e.y] !== undefined) types[e.y]++;
    if (e.y === "sub" || e.y === "typo") { const k = `${e.u}→${e.r}`; pairs[k] = (pairs[k] || 0) + 1; }
    if (e.y === "missing") missing[e.r] = (missing[e.r] || 0) + 1;
    if (e.y === "extra") extra[e.u] = (extra[e.u] || 0) + 1;
  }
  const topics = {};
  for (const a of attempts) { const x = topics[a.t] || (topics[a.t] = { n: 0, ok: 0 }); x.n++; if (isOk(a.s)) x.ok++; }
  return { types, pairs, missing, extra, topics };
}
function tips(an) {
  const out = [], m = an.missing, sum = ws => ws.reduce((s, w) => s + (m[w] || 0), 0);
  const subsTo = ws => Object.entries(an.pairs).filter(([k]) => ws.includes(k.split("→")[1])).reduce((s, [, v]) => s + v, 0);
  if (sum(["a", "an", "the"]) + subsTo(["a", "an", "the"]) >= 3) out.push("<b>Artikeller (a / an / the):</b> Sık atlıyorsun ya da karıştırıyorsun. Türkçede artikel yok; İngilizcede tekil sayılabilir isimlerin önüne mutlaka bir artikel gelir.");
  if (sum(["am", "is", "are", "was", "were"]) >= 2) out.push("<b>be fiili:</b> “Kedim küçük” gibi cümlelerde <i>is/am/are</i> kullanmayı unutuyorsun. İngilizcede her cümlenin bir fiili olmalı.");
  if (sum(["have", "has", "had", "been"]) + subsTo(["have", "has", "had", "been"]) >= 2) out.push("<b>Perfect zamanlar:</b> <i>have/has/had + V3</i> yapısında eksiklerin var. “-dır/-dir’den beri”, “hiç … mi?”, “henüz” gibi ifadeler genelde perfect gerektirir.");
  if (sum(["in", "on", "at", "to", "for", "of", "with", "from", "by", "about"]) + subsTo(["in", "on", "at", "to", "for", "of", "with", "from", "by", "about"]) >= 3) out.push("<b>Edatlar (in / on / at / to / for…):</b> Türkçedeki ekler (-de, -e, -den) İngilizcede ayrı edat olarak yazılır. Edatları kalıp olarak öğrenmek işe yarar.");
  if (sum(["will", "would"]) + subsTo(["will", "would"]) >= 2) out.push("<b>will / would:</b> Gelecek zaman ve koşul cümlelerinde yardımcı fiili kaçırıyorsun.");
  if (an.types.moved >= 2) out.push("<b>Kelime sırası:</b> İngilizce <i>Özne + Fiil + Nesne</i> sırasını izler. Türkçedeki gibi fiili sona koymamaya dikkat et.");
  if (an.types.typo >= 3) out.push("<b>Yazım:</b> Birkaç yazım hatası yaptın. Zorlandığın kelimeleri birkaç kez yazarak tekrar etmek yardımcı olur.");
  const weak = Object.entries(an.topics).filter(([, x]) => x.n >= 2).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n)[0];
  if (weak && weak[1].ok / weak[1].n < .6) out.push(`<b>En zayıf konun: ${esc(T[weak[0]])}</b> (%${Math.round(100 * weak[1].ok / weak[1].n)}). Bu konudan bir test çözmeyi dene.`);
  return out;
}
function renderStats() {
  const box = $("v-stats");
  if (!attempts.length) { box.innerHTML = `<div class="card"><h2>Henüz veri yok</h2><p class="empty">Birkaç soru çözdükten sonra istatistiklerin ve zayıf konuların burada görünecek.</p></div>`; return; }
  const n = attempts.length, ok = attempts.filter(a => isOk(a.s)).length;
  const an = analyze(), info = infoMap();

  const levelRows = LEVELS.map(l => {
    const as = attempts.filter(a => a.l === l), c = as.filter(a => isOk(a.s)).length;
    const lvlAll = ALL.filter(s => s.l === l), seen = lvlAll.filter(s => info[s.id]).length;
    const passed = levelTests(l).filter(r => r.c / r.n >= PASS).length;
    return `<div class="row"><span class="name">${l} <small style="color:var(--muted);font-weight:400">${LEVEL_NAMES[l]}</small></span>
      <div class="bar" title="${as.length ? `${c}/${as.length} doğru` : "henüz soru yok"}"><i style="width:${as.length ? 100 * c / as.length : 0}%"></i></div>
      <span class="val">${as.length ? `<b>%${Math.round(100 * c / as.length)}</b> · ` : ""}${Math.min(passed, LEVEL_GOAL)}/${LEVEL_GOAL} test · ${seen}/${lvlAll.length} cümle</span></div>`;
  }).join("");

  const typeNames = { sub: ["Yanlış kelime", "sub"], missing: ["Eksik kelime", "missing"], extra: ["Fazla kelime", "extra"], typo: ["Yazım hatası", "typo"], moved: ["Kelime sırası", "moved"] };
  const tmax = Math.max(1, ...Object.values(an.types));
  const typeRows = Object.entries(typeNames).map(([k, [name, cls]]) => `
    <div class="row"><span class="name"><span class="tok ${cls}" style="padding:0 7px;font-size:13px;text-decoration:none">${name}</span></span>
    <div class="bar" title="${an.types[k]} kez"><i style="width:${100 * an.types[k] / tmax}%"></i></div>
    <span class="val"><b>${an.types[k]}</b> kez</span></div>`).join("");

  const topicList = Object.entries(an.topics).map(([t, x]) => ({ t, ...x, acc: x.ok / x.n })).sort((a, b) => a.acc - b.acc || b.n - a.n);
  const topicRows = topicList.map(x => `
    <div class="row topicrow"><span class="name" title="${esc(T[x.t])}">${esc(T[x.t])}</span>
    <div class="bar" title="${x.ok}/${x.n} doğru"><i style="width:${100 * x.acc}%"></i></div>
    <span class="val"><b>%${Math.round(100 * x.acc)}</b> · ${x.n} soru</span>
    <button class="btn ghost small" data-topic="${x.t}">Çalış</button></div>`).join("");

  const top = (obj, k = 12) => Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, k);
  const pairs = top(an.pairs), miss = top(an.missing), ext = top(an.extra);
  const tipList = tips(an);
  const recent = rounds.slice(-8).reverse();
  const fmt = ts => new Date(ts).toLocaleString("tr-TR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

  box.innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="v">${n}</div><div class="k">cevaplanan soru</div></div>
      <div class="tile"><div class="v">%${Math.round(100 * ok / n)}</div><div class="k">genel doğruluk</div></div>
      <div class="tile"><div class="v">${rounds.length}</div><div class="k">tamamlanan test</div></div>
      <div class="tile"><div class="v">${meta.best}</div><div class="k">en iyi seri</div></div>
    </div>

    <div class="card panel">
      <h2>Çalışman gereken yerler</h2>
      ${tipList.length ? `<ul class="tips">${tipList.map(t => `<li>${t}</li>`).join("")}</ul>` : `<p class="empty">Belirgin bir zayıf nokta yok. Daha fazla soru çözdükçe öneriler burada çıkacak.</p>`}
      <div class="actions" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        ${Object.values(info).some(x => !x.lastOk) ? `<button class="btn small" id="stMistakes">Yanlışlarımı tekrar et</button>` : ""}
        ${topicList[0] && topicList[0].acc < 1 ? `<button class="btn ghost small" data-topic="${topicList[0].t}">En zayıf konuyu çalış: ${esc(T[topicList[0].t])}</button>` : ""}
      </div>
    </div>

    <div class="card panel">
      <h2>Konulara göre başarı</h2>
      <p class="empty" style="margin-top:-6px;margin-bottom:12px">En zayıftan en güçlüye doğru sıralı.</p>
      <div class="rows">${topicRows}</div>
    </div>

    <div class="card panel">
      <h2>Seviyelere göre</h2>
      <div class="rows">${levelRows}</div>
    </div>

    <div class="card panel">
      <h2>Hata türleri</h2>
      <div class="rows">${typeRows}</div>
      <div class="two">
        <div><h3>Sık karıştırdığın kelimeler</h3>
          ${pairs.length ? `<div class="words">${pairs.map(([k, v]) => { const [u, r] = k.split("→"); return `<span class="tok sub"><s>${esc(u)}</s><span class="fix">${esc(r)}</span><span class="n">×${v}</span></span>`; }).join("")}</div>` : `<p class="empty">Yok</p>`}</div>
        <div><h3>Sık unuttuğun kelimeler</h3>
          ${miss.length ? `<div class="words">${miss.map(([w, v]) => `<span class="tok missing">${esc(w)} <span class="n">×${v}</span></span>`).join("")}</div>` : `<p class="empty">Yok</p>`}</div>
      </div>
      ${ext.length ? `<h3>Fazladan yazdıkların</h3><div class="words">${ext.map(([w, v]) => `<span class="tok extra">${esc(w)}</span><span class="n" style="color:var(--muted);font-size:12px;align-self:center">×${v}</span>`).join("")}</div>` : ""}
    </div>

    <div class="card panel">
      <h2>Son testler</h2>
      ${recent.length ? `<div class="rows">${recent.map(r => `
        <div class="row"><span class="name">${esc(r.label)}</span>
        <div class="bar" title="${r.c}/${r.n} doğru"><i style="width:${100 * r.c / r.n}%"></i></div>
        <span class="val"><b>${r.c}/${r.n}</b> · ${fmt(r.ts)}</span></div>`).join("")}</div>` : `<p class="empty">Henüz tamamlanmış bir test yok. ${ROUND} soruyu bitirince burada görünecek.</p>`}
    </div>`;
  box.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => startRound("topic", b.dataset.topic));
  const sm = $("stMistakes"); if (sm) sm.onclick = () => startRound("mistakes");
}

/* ---------- Yanlışlarım ---------- */

  const list = Object.entries(info).filter(([id, x]) => !x.lastOk && BY[id]).sort((a, b) => b[1].last - a[1].last);
  if (!list.length) { box.innerHTML = `<div class="card"><h2>Yanlışın yok 🎉</h2><p class="empty">Yanlış yaptığın, atladığın ya da ipucuyla çözdüğün cümleler burada toplanır. Bir sonraki denemede doğru yaparsan listeden çıkar.</p></div>`; return; }
  box.innerHTML = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <h2 style="margin:0">Yanlışlarım (${list.length})</h2>
      <button class="btn small" id="mRetry">Bunları tekrar et${list.length > ROUND ? ` (${ROUND} tanesi)` : ""}</button>
    </div>
    <p class="empty" style="margin-bottom:10px">Son denemende yanlış yaptığın cümleler. Doğru yaptığında listeden çıkar.</p>
    <ul class="mlist">${list.map(([id, x]) => { const a = x.lastA, s = BY[id]; return `
      <li><div class="q">${esc(s.tr)}</div>
      ${a.u ? `<div class="yours">Senin: <s>${esc(a.u)}</s></div>` : `<div class="yours">${esc(STATUS_TR[a.s])}</div>`}
      <div class="right">Doğru: ${esc(a.r)}</div>
      <div class="chips"><span class="chip">${s.l}</span><span class="chip">${esc(T[s.t])}</span>${x.wrong > 1 ? `<span class="chip">${x.wrong} kez yanlış</span>` : ""}</div></li>`; }).join("")}</ul></div>`;
  $("mRetry").onclick = () => startRound("mistakes");
}

/* ---------- Olaylar ---------- */
$("main").onclick = () => {
  if (!checked) return check();
  showQuestion();
};
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); check(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && checked && view === "practice") { e.preventDefault(); showQuestion(); }
});
$("patternBtn").onclick = () => { $("patternPre").hidden = !$("patternPre").hidden; $("answer").focus(); };
$("hintBtn").onclick = hint;
$("revealBtn").onclick = () => check("reveal");
$("skipBtn").onclick = skip;
document.querySelectorAll(".tab").forEach(t => t.onclick = () => setView(t.dataset.view));
$("resetBtn").onclick = () => {
  if (!confirm("Tüm istatistikler, yanlışlar ve tur geçmişi silinecek. Emin misin?")) return;
  attempts = []; rounds = []; meta = { streak: 0, best: 0 }; round = buildRound("level", level);
  saveAll(); renderHeader(); renderLevels(); setView("practice"); showQuestion();
};

if (!round) round = buildRound("level", level);
saveAll(); renderLevels(); renderHeader(); showQuestion();
</script>
</body>
</html>
